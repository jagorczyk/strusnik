name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/flask/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/flask/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend/flask
        run: python -m unittest discover -s backend/flask/tests -p "test_*.py"

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/strusnik
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/strusnik/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy production
    needs: [backend-tests, frontend-checks]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure deploy SSH
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/strusnik-deploy"
          chmod 600 "$HOME/.ssh/strusnik-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy commit to EC2
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/strusnik-deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$TARGET_SHA" <<'REMOTE'
          set -euo pipefail
          target_sha="$1"
          app_dir="/home/deploy/strusnik"
          cd "$app_dir"
          git fetch origin main
          git reset --hard "$target_sha"
          bash deploy/deploy.sh "$target_sha"
          REMOTE
